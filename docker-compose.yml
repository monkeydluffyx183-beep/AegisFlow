name: aegisflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-aegis}
      POSTGRES_PASSWORD: ${DB_PASS:-aegis_dev_2026}
      POSTGRES_DB: ${DB_NAME:-aegisflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [aegisnet]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [aegisnet]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [aegisnet]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks: [aegisnet]

  api:
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: postgresql+psycopg://${DB_USER:-aegis}:${DB_PASS:-aegis_dev_2026}@postgres:5432/${DB_NAME:-aegisflow}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CORS_ORIGINS: http://localhost:5173
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-demo-service-key}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-me}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [aegisnet]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks: [aegisnet]

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  mlflow-data:

networks:
  aegisnet:
    driver: bridge
