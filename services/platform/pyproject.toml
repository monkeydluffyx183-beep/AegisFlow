[project]
name = "aegisflow-platform"
version = "0.1.0"
description = "AegisFlow API and local demo runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110", "UP017"]
