name: scheduled-retrain

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  challenger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/platform/requirements.txt
      - run: mkdir -p data/models && PYTHONPATH=ml/src python -m aegis_ml.training.train_fraud --output data/models/challenger.json
      - run: echo "Publish the challenger report to MLflow/ModelOps; human promotion remains required."
